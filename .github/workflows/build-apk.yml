name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        id: build
        run: gradle assembleDebug --stacktrace
        continue-on-error: true

      - name: Inspect Myket + Adivery library classes
        if: always()
        run: |
          set +e
          gradle inspectDeps -q > /tmp/deps.txt
          cat /tmp/deps.txt
          MYKET_ART=$(grep -m1 -i "myket" /tmp/deps.txt | sed -E 's/.*FOUND: (.*) =====/\1/')
          ADIVERY_ART=$(grep -m1 -i "adivery" /tmp/deps.txt | sed -E 's/.*FOUND: (.*) =====/\1/')

          echo ""
          echo "===== Myket billing-client: full class list ====="
          echo "Artifact path: $MYKET_ART"
          if [ -n "$MYKET_ART" ]; then
            mkdir -p /tmp/myket_extract
            unzip -o "$MYKET_ART" -d /tmp/myket_extract > /dev/null
            # .aar files hold their code in an inner classes.jar
            INNER_JAR=$(find /tmp/myket_extract -iname "classes.jar" | head -1)
            if [ -n "$INNER_JAR" ]; then
              unzip -l "$INNER_JAR" | grep '\.class'
              mkdir -p /tmp/myket_classes
              unzip -o "$INNER_JAR" -d /tmp/myket_classes > /dev/null
            else
              find /tmp/myket_extract -iname "*.class"
            fi
            echo ""
            echo "----- javap: ir.myket.billingclient.IabHelper (real public methods) -----"
            IABHELPER_CLASS=$(find /tmp/myket_classes /tmp/myket_extract -iname "IabHelper.class" 2>/dev/null | head -1)
            if [ -n "$IABHELPER_CLASS" ]; then javap -p "$IABHELPER_CLASS"; fi
          fi

          echo ""
          echo "===== Adivery sdk: AdiveryListener method signatures ====="
          echo "Artifact path: $ADIVERY_ART"
          if [ -n "$ADIVERY_ART" ]; then
            mkdir -p /tmp/adivery_extract
            unzip -o "$ADIVERY_ART" -d /tmp/adivery_extract > /dev/null
            INNER_JAR=$(find /tmp/adivery_extract -iname "classes.jar" | head -1)
            if [ -n "$INNER_JAR" ]; then
              mkdir -p /tmp/adivery_classes
              unzip -o "$INNER_JAR" -d /tmp/adivery_classes > /dev/null
              LISTENER_CLASS=$(find /tmp/adivery_classes -iname "AdiveryListener.class" | head -1)
            else
              LISTENER_CLASS=$(find /tmp/adivery_extract -iname "AdiveryListener.class" | head -1)
            fi
            echo "Listener class: $LISTENER_CLASS"
            if [ -n "$LISTENER_CLASS" ]; then javap -p "$LISTENER_CLASS"; fi
          fi
          exit 0

      - name: Report build result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build step failed - see 'Build debug APK' log above for the real error."
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TraderShow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
