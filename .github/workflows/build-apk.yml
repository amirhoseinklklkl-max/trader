name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        id: build
        run: gradle assembleDebug --stacktrace
        continue-on-error: true

      - name: Inspect Myket + Adivery library classes
        if: always()
        run: |
          gradle inspectDeps -q > /tmp/deps.txt || true
          cat /tmp/deps.txt
          MYKET_JAR=$(grep -m1 -i "myket" /tmp/deps.txt | sed -E 's/.*FOUND: (.*) =====/\1/')
          ADIVERY_JAR=$(grep -m1 -i "adivery" /tmp/deps.txt | sed -E 's/.*FOUND: (.*) =====/\1/')

          echo ""
          echo "===== Myket billing-client jar: full class list ====="
          echo "Jar path: $MYKET_JAR"
          if [ -n "$MYKET_JAR" ]; then unzip -l "$MYKET_JAR" | grep '\.class'; fi

          echo ""
          echo "===== Adivery sdk jar: AdiveryListener method signatures ====="
          echo "Jar path: $ADIVERY_JAR"
          if [ -n "$ADIVERY_JAR" ]; then
            mkdir -p /tmp/adivery_extract
            unzip -o "$ADIVERY_JAR" -d /tmp/adivery_extract > /dev/null || true
            LISTENER_CLASS=$(find /tmp/adivery_extract -iname "AdiveryListener.class" | head -1)
            echo "Listener class: $LISTENER_CLASS"
            if [ -n "$LISTENER_CLASS" ]; then javap -p "$LISTENER_CLASS" || true; fi
          fi

      - name: Report build result
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "Build step failed - see 'Build debug APK' log above for the real error."
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TraderShow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
